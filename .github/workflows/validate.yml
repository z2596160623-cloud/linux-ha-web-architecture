---
name: Validate infrastructure code

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core ansible-lint yamllint
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Install Ansible collections
        working-directory: ansible
        run: ansible-galaxy collection install -r collections/requirements.yml

      - name: Prepare non-secret CI inputs
        working-directory: ansible
        run: |
          cp inventory.example.ini inventory.ini
          cp vault.example.yml vault.yml

      - name: Lint YAML and shell scripts
        run: |
          yamllint .
          shellcheck scripts/*.sh

      - name: Lint Ansible content
        run: ansible-lint ansible

      - name: Validate inventory and playbook syntax
        working-directory: ansible
        run: |
          ansible-inventory -i inventory.ini --graph
          ansible-playbook -i inventory.ini site.yml -e @vault.yml --syntax-check
