<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Linux high-availability web architecture</title>
  <desc id="desc">Clients connect to a Keepalived virtual IP backed by two HAProxy nodes, three web servers, a MySQL database, an NFS server, and an Ansible control node.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#10263d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#65d6ff"/>
    </marker>
    <style>
      .title{font:700 32px 'Segoe UI',Arial,sans-serif;fill:#f7fbff}.subtitle{font:400 16px 'Segoe UI',Arial,sans-serif;fill:#9fbbd3}.label{font:700 17px 'Segoe UI',Arial,sans-serif;fill:#f7fbff}.small{font:400 13px 'Segoe UI',Arial,sans-serif;fill:#b8d0e4}.ip{font:600 12px Consolas,monospace;fill:#65d6ff}.node{fill:#132f4a;stroke:#2d6d97;stroke-width:1.5}.accent{fill:#0d6178;stroke:#65d6ff;stroke-width:2}.state{fill:#253d33;stroke:#51d88a;stroke-width:1.5}.data{fill:#3b2d55;stroke:#b995ff;stroke-width:1.5}.line{fill:none;stroke:#65d6ff;stroke-width:3;marker-end:url(#arrow)}.bus{fill:none;stroke:#65d6ff;stroke-width:3}.control{fill:none;stroke:#ffc857;stroke-width:2;stroke-dasharray:8 7}.zone{fill:none;stroke:#2b4a63;stroke-width:1.5;stroke-dasharray:6 8}.zoneText{font:600 13px 'Segoe UI',Arial,sans-serif;fill:#789ab5;letter-spacing:1px}
    </style>
  </defs>
  <rect width="1200" height="700" rx="24" fill="url(#bg)"/>
  <text x="54" y="58" class="title">Linux Web High-Availability Lab</text>
  <text x="54" y="87" class="subtitle">Ansible automation · Keepalived VRRP · HAProxy health checks · Nginx/PHP-FPM · MySQL · NFS</text>

  <rect x="36" y="118" width="1128" height="122" rx="18" class="zone"/>
  <text x="54" y="143" class="zoneText">ENTRY &amp; LOAD BALANCING</text>
  <rect x="62" y="163" width="150" height="54" rx="14" class="node" filter="url(#shadow)"/>
  <text x="137" y="187" text-anchor="middle" class="label">Clients</text>
  <text x="137" y="205" text-anchor="middle" class="small">HTTP requests</text>
  <path d="M212 190 H307" class="line"/>
  <rect x="311" y="154" width="176" height="72" rx="16" class="accent" filter="url(#shadow)"/>
  <text x="399" y="181" text-anchor="middle" class="label">Keepalived VIP</text>
  <text x="399" y="204" text-anchor="middle" class="ip">192.168.88.80</text>
  <path d="M487 190 H548" class="line"/>
  <rect x="552" y="153" width="224" height="74" rx="16" class="state" filter="url(#shadow)"/>
  <text x="664" y="179" text-anchor="middle" class="label">HAProxy 01 · MASTER</text>
  <text x="664" y="202" text-anchor="middle" class="ip">192.168.88.5 · VIP owner</text>
  <rect x="818" y="153" width="224" height="74" rx="16" class="node" filter="url(#shadow)"/>
  <text x="930" y="179" text-anchor="middle" class="label">HAProxy 02 · BACKUP</text>
  <text x="930" y="202" text-anchor="middle" class="ip">192.168.88.6</text>
  <path d="M776 190 H818" class="control"/>

  <rect x="36" y="266" width="1128" height="178" rx="18" class="zone"/>
  <text x="54" y="291" class="zoneText">STATELESS WEB TIER</text>
  <path d="M664 227 V315 H258 V331" class="line"/>
  <path d="M664 315 V331" class="line"/>
  <path d="M664 315 H1068 V331" class="line"/>
  <rect x="148" y="335" width="220" height="82" rx="16" class="node" filter="url(#shadow)"/>
  <text x="258" y="363" text-anchor="middle" class="label">web1</text>
  <text x="258" y="386" text-anchor="middle" class="small">Nginx · PHP-FPM</text>
  <text x="258" y="405" text-anchor="middle" class="ip">192.168.88.11</text>
  <rect x="554" y="335" width="220" height="82" rx="16" class="node" filter="url(#shadow)"/>
  <text x="664" y="363" text-anchor="middle" class="label">web2</text>
  <text x="664" y="386" text-anchor="middle" class="small">Nginx · PHP-FPM</text>
  <text x="664" y="405" text-anchor="middle" class="ip">192.168.88.12</text>
  <rect x="958" y="335" width="220" height="82" rx="16" class="node" filter="url(#shadow)" opacity="0.72"/>
  <text x="1068" y="363" text-anchor="middle" class="label">web3</text>
  <text x="1068" y="386" text-anchor="middle" class="small">Optional capacity node</text>
  <text x="1068" y="405" text-anchor="middle" class="ip">192.168.88.13</text>

  <rect x="36" y="470" width="1128" height="130" rx="18" class="zone"/>
  <text x="54" y="495" class="zoneText">SHARED STATE</text>
  <path d="M258 417 V485 M664 417 V485 M1068 417 V485 M258 485 H1068" class="bus"/>
  <path d="M539 485 V506" class="line"/>
  <path d="M919 485 V506" class="line"/>
  <rect x="414" y="510" width="250" height="70" rx="16" class="data" filter="url(#shadow)"/>
  <text x="539" y="538" text-anchor="middle" class="label">NFS Shared Storage</text>
  <text x="539" y="561" text-anchor="middle" class="ip">192.168.88.31 · /nfs_root</text>
  <rect x="794" y="510" width="250" height="70" rx="16" class="data" filter="url(#shadow)"/>
  <text x="919" y="538" text-anchor="middle" class="label">MySQL Database</text>
  <text x="919" y="561" text-anchor="middle" class="ip">192.168.88.21 · wordpress</text>

  <rect x="62" y="625" width="288" height="50" rx="14" fill="#4a3a18" stroke="#ffc857" stroke-width="1.5"/>
  <text x="206" y="648" text-anchor="middle" class="label">Ansible Control · pubserver</text>
  <text x="206" y="666" text-anchor="middle" class="ip">192.168.88.240</text>
  <path d="M350 650 H1095 V227" class="control"/>
  <text x="1112" y="642" text-anchor="end" class="small">configuration plane</text>
</svg>
